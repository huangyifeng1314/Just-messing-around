<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>DevNav · 开发者工具导航</title>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg: #0a0e17;
  --surface: rgba(255, 255, 255, 0.05);
  --surface-strong: rgba(255, 255, 255, 0.09);
  --surface-hover: rgba(255, 255, 255, 0.13);
  --border: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.18);
  --text: #eef2f8;
  --text-dim: #9aa7bd;
  --text-faint: #6b7890;
  --accent: #8b5cf6;
  --accent-2: #22d3ee;
  --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
  --nav-bg: rgba(12, 16, 28, 0.62);
  --nav-border: rgba(255, 255, 255, 0.12);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 22px 48px rgba(0, 0, 0, 0.55);
  --radius: 16px;
  --radius-sm: 12px;
}

[data-theme="light"] {
  --bg: #eef2f8;
  --surface: rgba(255, 255, 255, 0.62);
  --surface-strong: rgba(255, 255, 255, 0.85);
  --surface-hover: rgba(255, 255, 255, 0.96);
  --border: rgba(15, 23, 42, 0.10);
  --border-strong: rgba(15, 23, 42, 0.20);
  --text: #0f172a;
  --text-dim: #52607a;
  --text-faint: #8b96ad;
  --nav-bg: rgba(255, 255, 255, 0.62);
  --nav-border: rgba(15, 23, 42, 0.12);
  --shadow: 0 12px 30px rgba(30, 41, 59, 0.18);
  --shadow-lg: 0 22px 44px rgba(30, 41, 59, 0.24);
}

/* ============ 基础重置 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  transition: background .3s ease, color .3s ease;
  background-image:
    radial-gradient(1100px 600px at 12% -8%, rgba(139, 92, 246, 0.16), transparent 60%),
    radial-gradient(900px 520px at 95% 5%, rgba(34, 211, 238, 0.13), transparent 55%),
    radial-gradient(800px 600px at 50% 110%, rgba(139, 92, 246, 0.10), transparent 60%);
  background-attachment: fixed;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ============ 应用容器 ============ */
#app {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 16px;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

/* ============ 页面切换 ============ */
.page { display: none; }
.page.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 页头 ============ */
.page-header {
  padding: 22px 4px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.page-title { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
.page-title .grad {
  background: var(--accent-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.page-sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

/* ============ 搜索栏 ============ */
.search-box { position: relative; margin: 6px 4px 16px; }
.search-box .icon {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%); font-size: 16px; opacity: .65; pointer-events: none;
}
.search-box input {
  width: 100%; height: 52px;
  padding: 0 18px 0 48px;
  font-size: 15px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
}
.search-box input::placeholder { color: var(--text-faint); }
.search-box input:focus {
  border-color: var(--accent);
  background: var(--surface-strong);
  box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
}

/* ============ 快捷分类标签 ============ */
.tag-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 2px 4px 8px; scrollbar-width: none;
}
.chip {
  flex: 0 0 auto;
  padding: 8px 16px;
  font-size: 13px; font-weight: 600;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all .22s ease;
  white-space: nowrap;
}
.chip:hover { color: var(--text); background: var(--surface-hover); }
.chip.active {
  color: #fff;
  background: var(--accent-grad);
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(139, 92, 246, 0.35);
}

/* ============ 区块标题 ============ */
.section {
  margin: 22px 4px 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title {
  font-size: 17px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.section-title .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-grad);
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
}
.section-more { font-size: 13px; color: var(--text-faint); }

/* ============ 工具卡片 ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  margin: 0 4px;
}
.tool-card {
  position: relative;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  cursor: pointer;
  transition: transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
  animation: riseIn .4s ease backwards;
}
.tool-card:hover {
  transform: translateY(-5px);
  background: var(--surface-strong);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-lg);
}
.card-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 12px;
}
.tool-icon {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  font-size: 24px;
  border-radius: 13px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(34, 211, 238, 0.14));
  border: 1px solid var(--border);
}
.tool-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.tool-desc {
  font-size: 13px; color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 40px;
}
.tool-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  color: var(--text-dim);
  background: var(--surface-strong);
  border: 1px solid var(--border);
}

/* 收藏按钮 */
.fav-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  font-size: 17px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: transform .15s ease, background .2s ease;
  flex: 0 0 auto;
}
.fav-btn:active { transform: scale(0.72); }
.fav-btn.active { background: rgba(251, 113, 133, 0.18); border-color: rgba(251, 113, 133, 0.4); }
.fav-btn.pop { animation: heartPop .35s ease; }
@keyframes heartPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 热门工具榜 ============ */
.hot-list { margin: 0 4px; }
.hot-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 14px; margin-bottom: 10px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  cursor: pointer;
  transition: transform .22s ease, background .22s ease, border-color .22s ease;
}
.hot-item:hover { transform: translateX(4px); background: var(--surface-strong); border-color: var(--border-strong); }
.rank {
  width: 26px; text-align: center;
  font-size: 16px; font-weight: 800; font-style: italic;
  color: var(--text-faint);
  flex: 0 0 auto;
}
.hot-item:nth-child(1) .rank { color: #f59e0b; }
.hot-item:nth-child(2) .rank { color: #94a3b8; }
.hot-item:nth-child(3) .rank { color: #d97706; }
.hot-item .tool-icon { width: 40px; height: 40px; font-size: 21px; border-radius: 11px; }
.hot-info { flex: 1; min-width: 0; }
.hot-name { font-size: 14px; font-weight: 700; }
.hot-desc {
  font-size: 12px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hot-badge { font-size: 12px; font-weight: 700; color: #fbbf24; flex: 0 0 auto; }

/* ============ 分类页布局 ============ */
.category-layout { display: flex; gap: 18px; margin-top: 8px; }
.cat-sidebar {
  flex: 0 0 170px;
  position: sticky; top: 16px; align-self: flex-start;
  display: flex; flex-direction: column; gap: 4px;
}
.cat-sidebar .chip { text-align: left; border-radius: 12px; }
.cat-tabs {
  display: none;
  overflow-x: auto; gap: 8px;
  padding: 2px 4px 10px; scrollbar-width: none;
}
.cat-main { flex: 1; min-width: 0; }
.sort-bar { display: flex; align-items: center; gap: 8px; margin: 4px 4px 16px; }
.sort-bar .label { font-size: 13px; color: var(--text-faint); }
.sort-btn {
  padding: 6px 13px;
  font-size: 13px; font-weight: 600;
  color: var(--text-dim);
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all .2s ease;
}
.sort-btn.active { color: #fff; background: var(--accent-grad); border-color: transparent; }
.cat-count { margin-left: auto; font-size: 12px; color: var(--text-faint); }

/* ============ 我的页 ============ */
.mine-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 6px 16px;
  margin: 0 4px 14px;
}
.mine-empty {
  text-align: center; padding: 34px 10px;
  color: var(--text-faint); font-size: 13px;
}
.mine-empty .big { font-size: 34px; display: block; margin-bottom: 10px; opacity: .7; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0;
}
.setting-row + .setting-row { border-top: 1px solid var(--border); }
.setting-info { flex: 1; padding-right: 12px; }
.setting-name { font-size: 14px; font-weight: 600; }
.setting-desc { font-size: 12px; color: var(--text-faint); }

/* 开关 */
.switch {
  position: relative;
  width: 48px; height: 28px;
  border-radius: 999px;
  background: var(--surface-strong);
  border: 1px solid var(--border);
  transition: background .25s ease;
  flex: 0 0 auto;
}
.switch::after {
  content: "";
  position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform .25s ease;
}
.switch.on { background: var(--accent-grad); border-color: transparent; }
.switch.on::after { transform: translateX(20px); }

.action-btn {
  padding: 9px 16px;
  font-size: 14px; font-weight: 600;
  border-radius: 12px;
  color: #fff;
  background: var(--accent-grad);
  border: none;
  box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.action-btn:active { transform: scale(0.96); }
.action-btn.ghost {
  background: var(--surface-strong);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: none;
}

/* ============ 底部导航栏 ============ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  display: flex; justify-content: center;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--nav-border);
}
.nav-inner { width: 100%; max-width: 480px; display: flex; }
.nav-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0 4px;
  border-radius: 14px;
  color: var(--text-faint);
  transition: color .25s ease, transform .2s ease;
}
.nav-item .nav-icon { font-size: 21px; line-height: 1; transition: transform .25s ease; }
.nav-item .nav-label { font-size: 11px; font-weight: 600; }
.nav-item.active { color: var(--accent-2); }
.nav-item.active .nav-icon { transform: translateY(-2px) scale(1.12); }
.nav-item:active { transform: scale(0.92); }

/* ============ 响应式 ============ */
@media (min-width: 768px) {
  #app { padding: 0 28px; padding-bottom: 110px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .cat-sidebar { display: flex; }
  .cat-tabs { display: none; }
}
@media (max-width: 767px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .cat-sidebar { display: none; }
  .cat-tabs { display: flex; }
  .page-title { font-size: 21px; }
}
/* ============ 登录 / 账号 ============ */
.auth-card {
  margin: 0 4px 16px;
  padding: 24px 20px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: center;
}
.auth-avatar {
  width: 64px; height: 64px;
  margin: 0 auto 12px;
  display: grid; place-items: center;
  font-size: 28px;
  border-radius: 50%;
  background: var(--accent-grad);
  color: #fff;
  box-shadow: 0 10px 24px rgba(139, 92, 246, 0.4);
  overflow: hidden;
}
.auth-avatar.letter { font-size: 26px; font-weight: 800; }
.auth-avatar img { width: 100%; height: 100%; object-fit: cover; }
.auth-title { font-size: 18px; font-weight: 700; }
.auth-desc { font-size: 13px; color: var(--text-dim); margin: 4px 0 18px; }
.oauth-list { display: flex; flex-direction: column; gap: 10px; }
.oauth-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; height: 48px;
  font-size: 15px; font-weight: 600;
  border-radius: 12px;
  border: none;
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.oauth-btn:active { transform: scale(0.97); }
.oauth-btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
.oauth-btn.github { background: #24292f; color: #fff; }
.oauth-btn.github:hover { filter: brightness(1.15); box-shadow: 0 10px 24px rgba(36, 41, 47, 0.45); }
.oauth-btn.google { background: #fff; color: #3c4043; border: 1px solid #dadce0; }
.oauth-btn.google:hover { box-shadow: 0 10px 24px rgba(60, 64, 67, 0.18); }

.auth-user { display: flex; align-items: center; gap: 14px; text-align: left; }
.auth-user .auth-avatar { width: 54px; height: 54px; margin: 0; flex: 0 0 auto; font-size: 24px; }
.auth-user-info { flex: 1; min-width: 0; }
.auth-user-name { font-size: 16px; font-weight: 700; }
.auth-user-email { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.provider-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  margin-top: 6px;
  color: var(--text-dim);
  background: var(--surface-strong);
  border: 1px solid var(--border);
}
.auth-actions { display: flex; gap: 10px; margin-top: 16px; }
.auth-actions .action-btn { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="page-home" class="page active">
    <header class="page-header">
      <div>
        <h1 class="page-title">Dev<span class="grad">Nav</span></h1>
        <p class="page-sub">精选开发者工具 · 一站直达</p>
      </div>
      <span style="font-size:30px">🧭</span>
    </header>

    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="home-search" type="text" placeholder="搜索工具名称、描述或标签…" autocomplete="off">
    </div>

    <div class="tag-scroll" id="home-tags"></div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>精选推荐</div>
      <span class="section-more">✨ 编辑精选</span>
    </div>
    <div class="grid" id="home-featured"></div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>热门工具榜</div>
      <span class="section-more">🔥 TOP 10</span>
    </div>
    <div class="hot-list" id="home-hot"></div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>最新收录</div>
      <span class="section-more">🆕 最近添加</span>
    </div>
    <div class="grid" id="home-latest"></div>
  </section>

  <!-- ============ 分类页 ============ -->
  <section id="page-category" class="page">
    <header class="page-header">
      <div>
        <h1 class="page-title">分类浏览</h1>
        <p class="page-sub">按类别探索所有工具</p>
      </div>
      <span style="font-size:30px">📂</span>
    </header>

    <div class="category-layout">
      <aside class="cat-sidebar" id="cat-sidebar"></aside>
      <div class="cat-main">
        <div class="cat-tabs" id="cat-tabs"></div>
        <div class="sort-bar">
          <span class="label">排序</span>
          <button class="sort-btn active" data-sort="hot">🔥 热度</button>
          <button class="sort-btn" data-sort="latest">🕒 最新</button>
          <button class="sort-btn" data-sort="name">🔤 名称</button>
          <span class="cat-count" id="cat-count"></span>
        </div>
        <div class="grid" id="cat-grid"></div>
      </div>
    </div>
  </section>

  <!-- ============ 我的页 ============ -->
  <section id="page-mine" class="page">
    <header class="page-header">
      <div>
        <h1 class="page-title">我的</h1>
        <p class="page-sub">收藏、历史与个性化设置</p>
      </div>
      <span style="font-size:30px">❤️</span>
    </header>

    <!-- 登录 / 账号 -->
    <div class="section">
      <div class="section-title"><span class="dot"></span>账号</div>
      <span class="section-more" id="auth-provider"></span>
    </div>
    <div id="auth-section"></div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>我的收藏</div>
      <span class="section-more" id="fav-count"></span>
    </div>
    <div class="grid" id="mine-fav"></div>
    <div class="mine-empty" id="fav-empty" style="display:none">
      <span class="big">🤍</span>还没有收藏，点击卡片右上角的心形按钮收藏工具
    </div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>浏览历史</div>
      <span class="section-more" id="his-count"></span>
    </div>
    <div class="hot-list" id="mine-history"></div>
    <div class="mine-empty" id="his-empty" style="display:none">
      <span class="big">🕒</span>暂无浏览记录
    </div>

    <div class="section">
      <div class="section-title"><span class="dot"></span>设置</div>
    </div>
    <div class="mine-card">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-name">🌙 深色主题</div>
          <div class="setting-desc">切换深色 / 浅色外观</div>
        </div>
        <div class="switch on" id="theme-switch"></div>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-name">💾 数据导出</div>
          <div class="setting-desc">导出收藏与浏览历史为 JSON</div>
        </div>
        <button class="action-btn" id="export-btn">导出</button>
      </div>
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-name">🧹 清除数据</div>
          <div class="setting-desc">清空收藏与浏览历史</div>
        </div>
        <button class="action-btn ghost" id="clear-btn">清除</button>
      </div>
    </div>
